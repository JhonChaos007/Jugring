<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Jugring</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; height: 100vh;">
    <canvas id="unity-canvas" tabindex="-1" style="width: 100%; height: 100%; background: #231F20; object-fit: contain;"></canvas>
    <script src="Build/Jugring.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      // キャンバスのリサイズ処理を追加
      var canvas = document.querySelector("#unity-canvas");
      var unityAspectRatio = 1080 / 1920; // Unityのデフォルトのアスペクト比 (Width / Height)

      function resizeCanvas() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var windowAspectRatio = windowWidth / windowHeight;

        if (windowAspectRatio < unityAspectRatio) {
          // ウィンドウがUnityコンテンツよりも横長の場合、幅に合わせて高さを調整
          canvas.style.width = windowWidth + "px";
          canvas.style.height = (windowWidth / unityAspectRatio) + "px";
        } else {
          // ウィンドウがUnityコンテンツよりも縦長の場合、高さに合わせて幅を調整
          canvas.style.height = windowHeight + "px";
          canvas.style.width = (windowHeight * unityAspectRatio) + "px";
        }
        // キャンバスを中央に配置するためのマージンを調整
        canvas.style.marginLeft = (windowWidth - parseFloat(canvas.style.width)) / 2 + "px";
        canvas.style.marginTop = (windowHeight - parseFloat(canvas.style.height)) / 2 + "px";
      }

      // 初期ロード時とウィンドウのリサイズ時にキャンバスサイズを調整
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas(); // 初期呼び出し

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/Jugring.data",
        frameworkUrl: "Build/Jugring.framework.js",
        codeUrl: "Build/Jugring.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Jugring",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
